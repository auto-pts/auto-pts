[tool.ruff]
line-length = 127
exclude = [
  ".venv",
  "build",
  "dist",
  "tmp",
  "__pycache__",
  "*.egg-info",
  "tests/__pycache__"
]

[tool.ruff.lint]
select = ["F", "E", "N", "W", "I", "UP", "ISC", "TID", "PT", "A", "PERF", "B"]
# select = ["E", "W", "F", "I", "UP", "C90", "PYI", "ISC", "TID"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tools/generate_profile.py" = ["ISC001", "ISC002", "ISC003"]
"autopts/bot/common.py" = ["ALL"]
"autopts/ptscontrol.py" = ["ALL"]
"autoptsserver.py" = ["ALL"]
# btp modules define __all__, star imports re-export them as one namespace
"autopts/pybtp/btp/__init__.py" = ["F403"]
